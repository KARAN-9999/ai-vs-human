<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI vs Human - Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; padding: 24px; background:#f7fafc; color:#111827; }
    .container { max-width:900px; margin:0 auto; }
    textarea { width:100%; height:160px; padding:12px; font-size:14px; border-radius:8px; border:1px solid #d1d5db; }
    button { background:#0ea5a4; color:white; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; }
    .card { background:white; padding:16px; border-radius:8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-top:12px;}
    .result { font-weight:600; margin-bottom:6px; }
    pre { background:#0f172a; color:#e6eef6; padding:12px; border-radius:6px; overflow:auto; font-size:13px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>AI vs Human - Demo</h1>
    <p>Paste some text and click <strong>Classify</strong>.</p>

    <div class="card">
      <textarea id="inputText" placeholder="Paste text here...">This is an article written by a human.</textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="btnClassify">Classify</button>
        <button id="btnHistory">Show History</button>
      </div>
    </div>

    <div id="output" class="card" style="display:none;">
      <div class="result" id="resTitle"></div>
      <div id="meta"></div>
      <h4>Probabilities</h4>
      <pre id="probs"></pre>
    </div>

    <div id="historyCard" class="card" style="display:none;">
      <h3>Recent Predictions</h3>
      <div id="historyList"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
